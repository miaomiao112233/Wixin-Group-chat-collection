[project]
name = "wxsum"
version = "1.0.0"
description = "微信群消息监控 + AI 滚动总结 + 文件自动归档"
requires-python = ">=3.12"
dependencies = [
    "wechatauto-replica>=1.2.2",
    "PySide6>=6.7",
    "python-docx>=1.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "zstandard>=0.22",
    "psutil>=5.9",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.pyinstaller]
# 打包：pyinstaller --noconfirm WxSum.spec
